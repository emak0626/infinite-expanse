<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Infinite Expanse</title>
    <link rel="stylesheet" href="/static/style.css?v=1.1">
    <link rel="stylesheet" href="/static/style_components.css?v=1.1">
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=JetBrains+Mono:wght@400;700&display=swap"
        rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/apexcharts"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        .file-item-actions { display: flex; gap: 4px; }
        .trash-btn:hover { color: #f85149 !important; background: rgba(248, 81, 73, 0.1); }
        .delete-btn:hover { color: #da3633 !important; background: rgba(218, 54, 51, 0.2); }
        .scanning-glow { box-shadow: 0 0 10px var(--accent-primary); border-color: var(--accent-primary) !important; animation: pulse-border 2s infinite; }
        @keyframes pulse-border { 0% { opacity: 0.8; } 50% { opacity: 1; } 100% { opacity: 0.8; } }
    </style>
</head>

<body>
    <div class="container animate-in">
        <header class="glass-header">
            <div class="header-content">
                <h1 style="display: flex; align-items: baseline; gap: 8px;">
                    INFINITE<span class="highlight">EXPANSE</span>
                    <span style="font-size: 0.7rem; font-weight: 400; opacity: 0.5; font-family: 'JetBrains Mono';">Ver 1.0</span>
                </h1>
                <div class="status-dots" style="display: flex; gap: 4px; margin-top: 4px;">
                    <div id="db-status" class="status-indicator online" title="データベース"></div>
                    <div id="api-status" class="status-indicator online" title="証券API"></div>
                    <div id="local-ai-status" class="status-indicator offline" title="ローカルAI (Ollama)"></div>
                </div>
            </div>
            <div class="header-actions" style="display: flex; gap: 8px; align-items: center;">
                <div style="display: flex; flex-direction: column; align-items: flex-end; gap: 2px;">
                    <button id="scan-edinet-btn" class="btn btn-outline btn-sm" onclick="triggerEdinetScan()" title="適時開示情報（EDINET）をスキャンし、重要なニュースを自動抽出します">🔍 AUTO INFO</button>
                </div>
                <div style="display: flex; flex-direction: column; align-items: flex-end; gap: 2px;">
                    <select id="scan-strategy" class="btn-sm" style="background: rgba(255,255,255,0.05); color: #fff; border: 1px solid rgba(255,255,255,0.1); border-radius: 4px; font-size: 0.65rem; padding: 2px 4px; margin-bottom: 2px;">
                        <option value="short">⚡ 短期(急騰)</option>
                        <option value="growth">📈 新興株(Growth)</option>
                        <option value="standard">🏢 中堅株(Standard)</option>
                        <option value="long">🌱 長期(配当/割安)</option>
                        <option value="undervalued">💎 超割安(PBR)</option>
                    </select>
                    <button id="scan-market-btn" class="btn btn-outline btn-sm" onclick="triggerTechnicalScan()" title="東証全市場から条件に合う銘柄を数秒で抽出します">📡 SCAN</button>
                    <span id="last-scan-time" style="font-size: 0.55rem; opacity: 0.6; font-family: 'JetBrains Mono';">Last: --:--</span>
                </div>
                <div style="display: flex; flex-direction: column; align-items: flex-end; gap: 2px;">
                    <div style="display: flex; gap: 4px; align-items: center;">
                        <select id="ai-scope" class="btn-sm" style="background: rgba(255,255,255,0.05); color: #fff; border: 1px solid rgba(255,255,255,0.1); border-radius: 4px; font-size: 0.65rem; padding: 2px 4px;">
                            <option value="scanner">📋 スキャン結果</option>
                            <option value="watchlist">❤️ ウォッチリスト</option>
                        </select>
                        <button id="scan-cancel-btn" class="btn btn-outline btn-sm" onclick="cancelAIScreening()" style="display: none; border-color: var(--danger); color: var(--danger);" title="実行中のAI分析を中断します">🛑 CANCEL</button>
                        <button id="scan-ai-btn" class="btn btn-primary btn-sm" onclick="triggerAIScreening()" title="抽出された銘柄リストをローカルAIで有望度スコアリングします">🤖 AI SCREEN</button>
                    </div>
                    <span id="last-ai-scan-time" style="font-size: 0.55rem; opacity: 0.6; font-family: 'JetBrains Mono';">AI: --:--</span>
                </div>

                <button id="refresh-btn" class="icon-btn" title="更新">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M23 4v6h-6M1 20v-6h6M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path></svg>
                </button>
                <a href="/manual" class="icon-btn" title="操作マニュアル" style="color: var(--accent-primary); display: flex; align-items: center; justify-content: center; text-decoration: none;">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path></svg>
                </a>
                <div style="display: flex; gap: 8px; margin-left: 8px; border-left: 1px solid var(--border); padding-left: 12px;">
                    <button id="bulk-local-ai-btn" class="btn btn-outline btn-sm" style="border-color:#8e44ad; color:#8e44ad;" onclick="triggerBulkLocalTrade()" title="ウォッチリスト全銘柄をローカルAIで一括分析します">🤖 一括分析</button>
                    <button id="consolidated-prompt-btn" class="btn btn-primary btn-sm" onclick="getConsolidatedPrompt()" title="詳細分析と売買戦略を統合したGemini相談用プロンプトを生成します">📝 総合相談</button>
                    <button id="notebooklm-btn" class="btn btn-outline btn-sm" onclick="exportNotebookLM()" title="NotebookLM用データ出力">📤 NB抽出</button>
                    <button id="sync-drive-btn" class="btn btn-outline btn-sm" style="border-color:#4285f4; color:#4285f4;" onclick="syncNotebookLMToDrive()" title="NotebookLM統合レポートを作成し、Google Driveへ同期・共有します">☁️ NB同期</button>
                </div>
            </div>
        </header>

        <!-- Search Bar -->
        <div class="action-bar" style="margin: 16px 0;">
            <div class="search-box-wrapper">
                <input type="text" id="symbol-search" placeholder="銘柄コードを入力..." maxlength="4">
                <button class="add-btn" onclick="searchAndAddStock()" title="銘柄コードを入力してウォッチリストに追加します">➕</button>
            </div>
        </div>

            <!-- Market Context Area -->
            <div id="market-context-panel" class="glass-card animate-in" style="margin-bottom: 24px; padding: 16px; border-left: 4px solid var(--accent-primary);">
                <div style="display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 12px;">
                    <h3 style="margin: 0; font-size: 0.9rem; display: flex; align-items: center; gap: 8px;">
                        🌍 市場概況 <span id="market-context-time" style="font-size: 0.65rem; opacity: 0.6; font-weight: normal;">--:--</span>
                    </h3>
                     <div style="display: flex; gap: 8px;">
                        <button class="btn btn-outline btn-xs" onclick="showMarketAnalysisHistory()" title="以前に作成・保存した市場総合分析レポートを一覧表示します">過去の分析</button>
                        <button class="btn btn-primary btn-sm" onclick="showGeneralAnalysisPasteUI()" title="Geminiでの総合分析結果を正式なレポートとして保存します">分析結果を保存</button>
                    </div>
                </div>
                <div id="market-indices-row" style="display: flex; flex-wrap: wrap; gap: 15px; margin-bottom: 12px;">
                    <!-- Indices will be injected here -->
                    <div style="font-size: 0.75rem; opacity: 0.5;">市場データを読み込み中...</div>
                </div>
                <div id="market-trends-row" style="font-size: 0.75rem; display: flex; align-items: center; gap: 8px;">
                    <span style="opacity: 0.6;">注目のキーワード:</span>
                    <div id="market-trends-tags" style="display: flex; gap: 6px;"></div>
                </div>
            </div>

            <!-- Strategy Tabs -->
            <div id="market-dashboard">
                <!-- Heatmap -->
                <div class="section-title">銘柄別騰落状況</div>
                <div id="heatmap-scroll" class="heatmap-scroll">
                    <!-- Injected via JS -->
                </div>

                <div class="section-title">分析フィルター</div>
            <div class="strategy-tabs">
                <button class="tab-btn active" data-strategy="all">すべて</button>
                <button class="tab-btn" data-strategy="value_invest">💎 バリュー</button>
                <button class="tab-btn" data-strategy="high_dividend">💰 配当重視</button>
                <button class="tab-btn" data-strategy="short_squeeze">🔥 モメンタム</button>
                <button class="tab-btn" data-strategy="rebound">⚡ 反発期待</button>
                <button class="tab-btn" data-strategy="scanner">📡 スキャナー</button>
            </div>

            <!-- Scanner Options (Hidden by default) -->
            <div id="scanner-options" class="glass-card animate-in" style="display: none; margin: 12px 0; padding: 12px;">
                <div style="display: flex; align-items: center; justify-content: space-between; gap: 10px;">
                    <span class="detail-label" style="font-size: 0.8rem;">ランキング種別:</span>
                    <select id="ranking-type" onchange="renderStocks()" style="flex: 1; background: #1c2128; color: white; border: 1px solid #30363d; padding: 6px; border-radius: 6px;">
                        <option value="last_scan">📋 前回スキャン結果</option>
                        <option value="1">値上がり率</option>
                        <option value="2">値下がり率</option>
                        <option value="3">売買代金急増</option>
                        <option value="4">出来高急増</option>
                    </select>
                </div>
            </div>

            <!-- Workspace Console (Local Hub) -->
            <div id="workspace-console" class="glass-card animate-in" style="display: none; margin: 24px 0; padding: 0;">
                <div class="workspace-header" onclick="toggleWorkspaceConsole()" style="display: flex; justify-content: space-between; align-items: center; padding: 16px; cursor: pointer; user-select: none;">
                    <div style="display: flex; align-items: center; gap: 8px;">
                        <span id="workspace-toggle-icon" style="transition: transform 0.3s; font-size: 0.7rem; color: var(--text-secondary);">▶</span>
                        <div class="section-title" style="margin: 0;">分析レポート一覧 (Hub)</div>
                    </div>
                    <a href="/explorer" class="btn btn-outline btn-xs" style="font-size: 0.65rem; padding: 4px 8px;" onclick="event.stopPropagation()" title="ワークスペース内の全ファイルを管理・閲覧します">📂 フルエクスプローラー</a>
                </div>
                <div id="workspace-content" style="display: none; padding: 0 16px 16px 16px; border-top: 1px solid var(--border);">
                    <div id="workspace-links" style="margin-top: 12px;">
                        <!-- Files will be dynamically listed here -->
                    </div>
                </div>
            </div>
        </div>

        <main id="stock-list">
            <!-- Loading State -->
            <div class="loading-state">
                <div class="pulse-ring"></div>
                <p>市場データを同期中...</p>
            </div>
        </main>
    </div>

    <!-- Analysis Detail View -->
    <div id="analysis-overlay" class="overlay">
        <div class="overlay-content">
            <header class="overlay-header">
                <div style="display:flex; align-items:center; gap:15px;">
                    <div id="overlay-title">詳細分析結果</div>
                    <select id="history-select" onchange="loadSpecificAnalysis(this.value)" style="background:#1c2128; color:white; border:1px solid #30363d; padding:4px 8px; border-radius:4px; font-size:0.8rem;"></select>
                </div>
                <div style="display:flex; gap:10px;">
                    <button class="btn btn-primary btn-sm" onclick="showManualPasteUI()">結果を保存</button>
                    <button class="icon-btn close-btn" onclick="closeAnalysis()">✕</button>
                </div>
            </header>
            <div class="split-pane">
                <div class="pane-left">
                    <div id="chart-container"></div>
                </div>
                <div class="pane-right">
                    <div id="report-content" class="markdown-body">
                        <!-- AI Report Injected Here -->
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Hidden textarea for clipboard operations (positioned to avoid scroll jumps) -->
    <textarea id="clipboard-area" style="position: fixed; top: 0; left: -9999px; opacity: 0; pointer-events: none;"></textarea>

    <!-- Manual Prompt Copy Overlay -->
    <div id="manual-copy-overlay" class="overlay" onclick="if(event.target===this) closeManualCopyModal()">
        <div class="overlay-content" style="max-width: 600px; height: auto; margin: 20px;">
            <div class="overlay-header">
                <h2 style="margin:0; font-size:1.1rem; display:flex; align-items:center; gap:8px;">
                    📝 手動コピー
                </h2>
                <button class="icon-btn" onclick="closeManualCopyModal()" style="color:var(--text-muted)">✕</button>
            </div>
            <div style="padding: 20px;">
                <p style="font-size: 0.85rem; color: var(--text-secondary); margin-bottom: 12px;">
                    以下の内容をすべて選択してコピーし、Geminiのチャット欄に貼り付けてください。
                </p>
                <textarea id="manual-copy-textarea" readonly style="width:100%; height:300px; background:#0d1117; color:white; border:1px solid #30363d; padding:12px; border-radius:6px; font-family:'JetBrains Mono', monospace; font-size:0.85rem; line-height:1.5; resize:none;" onclick="this.select()"></textarea>
                <div style="margin-top: 16px; display: flex; justify-content: flex-end; gap: 10px;">
                    <button id="save-gemini-reply-btn" class="btn btn-outline" style="display:none; border-color:#8e44ad; color:#8e44ad;">💾 返信を保存する</button>
                    <button class="btn btn-outline" onclick="closeManualCopyModal()">閉じる</button>
                    <button class="btn btn-primary" onclick="window.open('https://gemini.google.com/app', '_blank'); closeManualCopyModal();">コピーした(Geminiを開く)</button>
                </div>
            </div>
        </div>
    </div>


    <script src="/static/script.js?v=1.7" defer></script>
</body>

</html>
