<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Infinite Expanse</title>
    <link rel="stylesheet" href="/static/style.css">
    <link rel="stylesheet" href="/static/style_components.css">
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=JetBrains+Mono:wght@400;700&display=swap"
        rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/apexcharts"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>

<body>
    <div class="container animate-in">
        <header class="glass-header">
            <div class="header-content">
                <h1>INFINITE<span class="highlight">EXPANSE</span></h1>
                <div class="status-dots" style="display: flex; gap: 4px; margin-top: 4px;">
                    <div id="db-status" class="status-indicator online" title="DB"></div>
                    <div id="api-status" class="status-indicator online" title="API"></div>
                </div>
            </div>
            <div class="header-actions">
                <button id="scan-edinet-btn" class="btn btn-outline btn-sm" onclick="triggerEdinetScan()" title="定期収集の他に今すぐ収集を開始します">🔍 AUTO INFO</button>
                <button id="scan-market-btn" class="btn btn-primary btn-sm" onclick="triggerMarketScan()" title="全市場スキャン開始">📡 SCAN</button>
                <button id="refresh-btn" class="icon-btn" onclick="fetchStocks()">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M23 4v6h-6M1 20v-6h6M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path></svg>
                </button>
            </div>
        </header>

        <!-- Search Bar -->
        <div class="action-bar" style="margin: 16px 0;">
            <div class="search-box-wrapper">
                <input type="text" id="symbol-search" placeholder="銘柄コードを入力..." maxlength="4">
                <button class="add-btn" onclick="searchAndAddStock()">➕</button>
            </div>
        </div>

            <!-- Strategy Tabs -->
            <div id="market-dashboard">
                <!-- Heatmap -->
                <div class="section-title">Market Pulse</div>
                <div id="heatmap-scroll" class="heatmap-scroll">
                    <!-- Injected via JS -->
                </div>

                <div class="section-title">Strategy Filters</div>
            <div class="strategy-tabs">
                <button class="tab-btn active" data-strategy="all">すべて</button>
                <button class="tab-btn" data-strategy="value_invest">💎 バリュー</button>
                <button class="tab-btn" data-strategy="high_dividend">💰 配当重視</button>
                <button class="tab-btn" data-strategy="short_squeeze">🔥 モメンタム</button>
                <button class="tab-btn" data-strategy="rebound">⚡ 反発期待</button>
                <button class="tab-btn" data-strategy="scanner">📡 スキャナー</button>
            </div>

            <!-- Scanner Options (Hidden by default) -->
            <div id="scanner-options" class="glass-card animate-in" style="display: none; margin: 12px 0; padding: 12px;">
                <div style="display: flex; align-items: center; justify-content: space-between; gap: 10px;">
                    <span class="detail-label" style="font-size: 0.8rem;">Ranking Type:</span>
                    <select id="ranking-type" onchange="fetchScannerData()" style="flex: 1; background: #1c2128; color: white; border: 1px solid #30363d; padding: 6px; border-radius: 6px;">
                        <option value="1">値上がり率</option>
                        <option value="2">値下がり率</option>
                        <option value="3">売買代金急増</option>
                        <option value="4">出来高急増</option>
                    </select>
                </div>
            </div>

            <!-- Workspace Console (Local Hub) -->
            <div id="workspace-console" class="glass-card animate-in" style="display: none; margin: 24px 0; padding: 16px;">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
                    <div class="section-title" style="margin: 0;">Intelligence Hub</div>
                    <a href="/explorer" class="btn btn-outline btn-xs" style="font-size: 0.65rem; padding: 4px 8px;">📂 フルエクスプローラー</a>
                </div>
                <div id="workspace-links">
                    <!-- Files will be dynamically listed here -->
                </div>
            </div>
        </div>

        <main id="stock-list">
            <!-- Loading State -->
            <div class="loading-state">
                <div class="pulse-ring"></div>
                <p>SYNCING MARKET MEMORY...</p>
            </div>
        </main>
    </div>

    <!-- Analysis Detail View -->
    <div id="analysis-overlay" class="overlay">
        <div class="overlay-content">
            <header class="overlay-header">
                <div style="display:flex; align-items:center; gap:15px;">
                    <div id="overlay-title">INSIGHTS</div>
                    <select id="history-select" onchange="loadSpecificAnalysis(this.value)" style="background:#1c2128; color:white; border:1px solid #30363d; padding:4px 8px; border-radius:4px; font-size:0.8rem;"></select>
                </div>
                <div style="display:flex; gap:10px;">
                    <button class="btn btn-outline btn-sm" onclick="showManualPasteUI()">Manual Input</button>
                    <button class="icon-btn close-btn" onclick="closeAnalysis()">✕</button>
                </div>
            </header>
            <div class="split-pane">
                <div class="pane-left">
                    <div id="chart-container"></div>
                </div>
                <div class="pane-right">
                    <div id="report-content" class="markdown-body">
                        <!-- AI Report Injected Here -->
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Hidden textarea for clipboard operations (positioned to avoid scroll jumps) -->
    <textarea id="clipboard-area" style="position: fixed; top: 0; left: -9999px; opacity: 0; pointer-events: none;"></textarea>

    <script src="/static/script.js"></script>
</body>

</html>
