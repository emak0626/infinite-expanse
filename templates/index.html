<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Infinite Expanse</title>
    <link rel="stylesheet" href="/static/style.css">
    <link rel="stylesheet" href="/static/style_components.css">
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=JetBrains+Mono:wght@400;700&display=swap"
        rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/apexcharts"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>

<body>
    <div class="container animate-in">
        <header class="glass-header">
            <div class="header-content">
                <h1>INFINITE<span class="highlight">EXPANSE</span></h1>
                <div class="status-dots" style="display: flex; gap: 4px; margin-top: 4px;">
                    <div id="db-status" class="status-indicator online" title="DB"></div>
                    <div id="api-status" class="status-indicator online" title="API"></div>
                </div>
            </div>
            <div class="header-actions">
                <div id="workspace-links" style="display: none; align-items: center; gap: 8px; margin-right: 12px;">
                    <a id="sheet-link" href="#" target="_blank" class="glass-icon" title="Sheets">📊</a>
                    <a id="drive-link" href="#" target="_blank" class="glass-icon" title="Drive">📁</a>
                </div>
                <button id="scan-market-btn" class="btn btn-primary btn-sm" onclick="triggerMarketScan()" title="全市場スキャン開始">📡 SCAN</button>
                <button id="refresh-btn" class="icon-btn" onclick="fetchStocks()">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M23 4v6h-6M1 20v-6h6M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path></svg>
                </button>
            </div>
        </header>

        <!-- Search Bar -->
        <div class="action-bar" style="margin: 16px 0;">
            <div class="search-box-wrapper">
                <input type="text" id="symbol-search" placeholder="銘柄コードを入力..." maxlength="4">
                <button class="add-btn" onclick="searchAndAddStock()">➕</button>
            </div>
        </div>

        <div id="market-dashboard">
            <!-- Heatmap -->
            <div class="section-title">Market Pulse</div>
            <div id="heatmap-scroll" class="heatmap-scroll">
                <!-- Injected via JS -->
            </div>

            <!-- Strategy Tabs -->
            <div class="section-title">Strategy Filters</div>
            <div class="strategy-tabs">
                <button class="tab-btn active" data-strategy="all">ALL</button>
                <button class="tab-btn" data-strategy="value_invest">💎 VALUE</button>
                <button class="tab-btn" data-strategy="high_dividend">💰 DIVIDEND</button>
                <button class="tab-btn" data-strategy="short_squeeze">🔥 MOMENTUM</button>
                <button class="tab-btn" data-strategy="rebound">⚡ REBOUND</button>
            </div>
        </div>

        <main id="stock-list">
            <!-- Loading State -->
            <div class="loading-state">
                <div class="pulse-ring"></div>
                <p>SYNCING MARKET MEMORY...</p>
            </div>
        </main>
    </div>

    <!-- Analysis Detail View -->
    <div id="analysis-overlay" class="overlay">
        <div class="overlay-content">
            <header class="overlay-header">
                <div id="overlay-title">INSIGHTS</div>
                <button class="icon-btn close-btn" onclick="closeAnalysis()">✕</button>
            </header>
            <div class="split-pane">
                <div class="pane-left">
                    <div id="chart-container"></div>
                </div>
                <div class="pane-right">
                    <div id="report-content" class="markdown-body">
                        <!-- AI Report Injected Here -->
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Hidden textarea for clipboard operations (positioned to avoid scroll jumps) -->
    <textarea id="clipboard-area" style="position: fixed; top: 0; left: -9999px; opacity: 0; pointer-events: none;"></textarea>

    <script src="/static/script.js"></script>
</body>

</html>
