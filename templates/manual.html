<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Infinite Expanse - Operation Manual</title>
    <link rel="stylesheet" href="/static/style.css">
    <link rel="stylesheet" href="/static/style_components.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        :root {
            --bg-dark: #0d1117;
            --glass-bg: rgba(22, 27, 34, 0.8);
            --border-color: rgba(48, 54, 61, 0.8);
            --accent-primary: #58a6ff;
            --text-regular: #c9d1d9;
            --text-bright: #f0f6fc;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-regular);
            font-family: 'Inter', sans-serif;
            line-height: 1.6;
            margin: 0;
            padding: 0;
        }

        .manual-container {
            max-width: 900px;
            margin: 40px auto;
            padding: 20px;
        }

        .glass-panel {
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 40px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            color: var(--accent-primary);
            text-decoration: none;
            margin-bottom: 24px;
            font-weight: 600;
            transition: opacity 0.2s;
        }

        .back-link:hover {
            opacity: 0.8;
        }

        .markdown-body h1 {
            color: var(--text-bright);
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 12px;
            margin-top: 0;
        }

        .markdown-body h2 {
            color: var(--accent-primary);
            margin-top: 32px;
            border-bottom: 1px solid rgba(48, 54, 61, 0.4);
            padding-bottom: 8px;
        }

        .markdown-body h3 {
            color: var(--text-bright);
            margin-top: 24px;
        }

        .markdown-body ul, .markdown-body ol {
            padding-left: 20px;
        }

        .markdown-body li {
            margin-bottom: 8px;
        }

        .markdown-body code {
            background: rgba(110, 118, 129, 0.4);
            padding: 2px 6px;
            border-radius: 4px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.9em;
        }

        .markdown-body strong {
            color: var(--accent-primary);
        }

        /* Sticky Navigation */
        .sticky-nav {
            position: sticky;
            top: 0;
            z-index: 100;
            background: rgba(13, 17, 23, 0.9);
            backdrop-filter: blur(8px);
            border-bottom: 1px solid var(--border-color);
            margin: -20px -20px 20px -20px;
            padding: 10px 20px;
            display: flex;
            gap: 10px;
            overflow-x: auto;
            scrollbar-width: none; /* Hide scrollbar for Chrome/Safari */
        }
        .sticky-nav::-webkit-scrollbar { display: none; }
        
        .nav-item {
            padding: 6px 14px;
            background: rgba(255,255,255,0.05);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            color: var(--text-regular);
            text-decoration: none;
            font-size: 0.8rem;
            white-space: nowrap;
            transition: all 0.2s;
        }
        .nav-item:hover {
            background: var(--accent-primary);
            color: white;
            border-color: var(--accent-primary);
        }
        .nav-item.active {
            background: var(--accent-primary);
            color: white;
        }

        @media (max-width: 768px) {
            .manual-container {
                margin: 20px;
                padding: 10px;
            }
            .glass-panel {
                padding: 24px;
            }
        }
    </style>
</head>
<body>
    <div class="manual-container">
        <a href="/" class="back-link">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="margin-right: 8px;">
                <path d="M19 12H5M12 19l-7-7 7-7"/>
            </svg>
            ダッシュボードに戻る
        </a>
        
        <div class="glass-panel">
            <nav class="sticky-nav">
                <a href="#section-1" class="nav-item">1. 概要</a>
                <a href="#section-2" class="nav-item">2. ワークフロー</a>
                <a href="#section-3" class="nav-item">3. 主要機能</a>
                <a href="#section-4" class="nav-item">4. NotebookLM連携</a>
                <a href="#section-5" class="nav-item">5. 保存場所</a>
                <a href="#section-6" class="nav-item">6. AIスコア定義</a>
                <a href="#section-7" class="nav-item">7. 用語集</a>
                <a href="#section-8" class="nav-item">8. トラブル対応</a>
            </nav>
            <div id="manual-content" class="markdown-body">
                <p>マニュアルを読み込み中...</p>
            </div>
        </div>
    </div>

    <script>
        async function loadManual() {
            try {
                const response = await fetch('/manual_md');
                const text = await response.text();
                const contentDiv = document.getElementById('manual-content');
                contentDiv.innerHTML = marked.parse(text);
                
                // Assign IDs to h2 headers for navigation
                const headers = contentDiv.querySelectorAll('h2');
                headers.forEach((h, index) => {
                    h.id = `section-${index + 1}`;
                });

                // Smooth scroll handling
                document.querySelectorAll('.nav-item').forEach(anchor => {
                    anchor.addEventListener('click', function (e) {
                        e.preventDefault();
                        const targetId = this.getAttribute('href').substring(1);
                        const targetElement = document.getElementById(targetId);
                        if (targetElement) {
                            window.scrollTo({
                                top: targetElement.offsetTop - 80, // Adjust for sticky nav
                                behavior: 'smooth'
                            });
                            // Update active state
                            document.querySelectorAll('.nav-item').forEach(nav => nav.classList.remove('active'));
                            this.classList.add('active');
                        }
                    });
                });

            } catch (error) {
                document.getElementById('manual-content').innerHTML = '<p style="color:red">マニュアルの読み込みに失敗しました。</p>';
            }
        }

        loadManual();
    </script>
</body>
</html>
