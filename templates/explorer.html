<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>File Explorer - Intelligence Hub</title>
    <link rel="stylesheet" href="/static/style_components.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=JetBrains+Mono&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0d1117;
            --card: #161b22;
            --border: #30363d;
            --text: #c9d1d9;
            --primary: #58a6ff;
        }
        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 20px;
        }
        .explorer-container {
            max-width: 1000px;
            margin: 0 auto;
        }
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 24px;
            padding-bottom: 16px;
            border-bottom: 1px solid var(--border);
        }
        .back-link {
            text-decoration: none;
            color: var(--primary);
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .tree-node {
            margin-left: 20px;
        }
        .folder {
            cursor: pointer;
            padding: 8px;
            display: flex;
            align-items: center;
            gap: 8px;
            border-radius: 6px;
            transition: background 0.2s;
        }
        .folder:hover { background: rgba(255,255,255,0.05); }
        .file {
            padding: 6px 8px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 0.85rem;
            color: #8b949e;
            border-radius: 4px;
            text-decoration: none;
            transition: color 0.2s;
        }
        .file:hover { color: var(--text); background: rgba(255,255,255,0.03); }
        .file-info { font-size: 0.75rem; opacity: 0.6; }
        .icon { font-size: 1.2rem; width: 24px; text-align: center; }
        .empty-msg { padding: 40px; text-align: center; opacity: 0.5; }
    </style>
</head>
<body>
    <div class="explorer-container">
        <div class="header">
            <a href="/" class="back-link">← Back to Dashboard</a>
            <h2 style="margin:0;">Intelligence Explorer</h2>
            <div style="font-size:0.8rem; opacity:0.6;">D:\infinite-expanse-data\workspace</div>
        </div>

        <div id="file-tree" class="glass-card">
            <div class="loading-state" style="padding: 40px; text-align: center;">Loading structure...</div>
        </div>
    </div>

    <script>
        async function fetchStructure() {
            try {
                const response = await fetch('/api/workspace/structure');
                const data = await response.json();
                renderTree(data, document.getElementById('file-tree'));
            } catch (err) {
                document.getElementById('file-tree').innerHTML = '<div class="empty-msg">Failed to load structure.</div>';
            }
        }

        function renderTree(nodes, container) {
            container.innerHTML = '';
            if (!nodes || nodes.length === 0) {
                container.innerHTML = '<div class="empty-msg">No files found.</div>';
                return;
            }

            nodes.forEach(node => {
                const div = document.createElement('div');
                div.className = 'tree-node';
                
                if (node.is_dir) {
                    div.innerHTML = `
                        <div class="folder">
                            <span class="icon">📁</span>
                            <span style="font-weight:600;">${node.name}</span>
                        </div>
                        <div class="children" style="display:block;"></div>
                    `;
                    const childrenContainer = div.querySelector('.children');
                    renderTree(node.children, childrenContainer);
                    
                    div.querySelector('.folder').onclick = () => {
                        const isHidden = childrenContainer.style.display === 'none';
                        childrenContainer.style.display = isHidden ? 'block' : 'none';
                        div.querySelector('.icon').innerText = isHidden ? '📂' : '📁';
                    };
                } else {
                    const date = new Date(node.mtime).toLocaleString();
                    const size = (node.size / 1024).toFixed(1) + ' KB';
                    div.innerHTML = `
                        <a href="${node.path}" target="_blank" class="file">
                            <div style="display:flex; align-items:center; gap:8px;">
                                <span class="icon">${node.name.endsWith('.csv') ? '📊' : '📃'}</span>
                                <span>${node.name}</span>
                            </div>
                            <div class="file-info">${date} | ${size}</div>
                        </a>
                    `;
                }
                container.appendChild(div);
            });
        }

        fetchStructure();
    </script>
</body>
</html>
